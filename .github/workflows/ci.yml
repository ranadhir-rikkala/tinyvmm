name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: build + unit tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTINYVMM_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  kvm-smoke:
    name: KVM smoke guests (x86_64)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTINYVMM_BUILD_TESTS=OFF
          cmake --build build
      - name: Enable /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Real-mode guest
        run: ./build/tinyvmm smoke --mode real
      - name: Long-mode guest (boot GDT + identity page tables)
        run: ./build/tinyvmm smoke --mode long

  linux-boot:
    name: Linux boot + latency trace (x86_64, experimental)
    runs-on: ubuntu-latest
    needs: kvm-smoke
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cpio
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTINYVMM_BUILD_TESTS=OFF
          cmake --build build
      - name: Enable /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fetch guest kernel and build initramfs
        run: |
          scripts/fetch-kernel.sh artifacts
          scripts/make-initramfs.sh artifacts
      - name: Boot (verbose console)
        run: |
          ./build/tinyvmm boot --kernel artifacts/vmlinux --initrd artifacts/initramfs.cpio \
            --mem 256 --exit-on-marker --timeout 60 --trace-json artifacts/trace-verbose.json
      - name: Boot (quiet console)
        run: |
          ./build/tinyvmm boot --kernel artifacts/vmlinux --initrd artifacts/initramfs.cpio \
            --mem 256 --append quiet --exit-on-marker --timeout 60 --trace-json artifacts/trace-quiet.json
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-traces
          path: artifacts/trace-*.json
          if-no-files-found: ignore
